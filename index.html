<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Início</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#fff}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{pageBg}}; font-family: 'Montserrat', sans-serif; color: #2B2B33">

<!-- CABEÇALHO -->
<div style="position: relative; box-sizing: border-box; height: 318px; padding: 40px 20px 0; background: linear-gradient(180deg, {{accent}} 0%, {{accentDark}} 100%); color: #FFFFFF">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 24px">Olá, Matheus Silva do...</h1>
<div style="display: flex; align-items: center; gap: 12px">
<button aria-label="Notificações" style="position: relative; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #FFFFFF">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
<span style="position: absolute; top: 0; right: 0; min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 5px; border-radius: 11px; background: #2FBF4A; color: #FFFFFF; font-size: 12px; font-weight: 700; line-height: 22px; text-align: center">68</span>
</button>
<button aria-label="Sair" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #FFFFFF">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"></path><path d="M14 8l4 4-4 4"></path><path d="M18 12H9"></path></svg>
</button>
</div>
</div>

<div style="margin-top: 22px; display: flex; align-items: flex-end; justify-content: space-between">
<div>
<div style="font-size: 14px; font-weight: 600; line-height: 20px">Saldo</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 28px; font-weight: 700; line-height: 40px">{{saldo}}</span>
<button aria-label="Ocultar saldo" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #FFFFFF">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><path d="M4 20L20 4"></path></svg>
</button>
</div>
</div>
<a href="#extrato" style="display: inline-block; padding: 12px 0 14px; font-size: 14px; font-weight: 700; text-decoration: underline">Ver extrato</a>
</div>

<div style="margin-top: 14px; display: flex; align-items: center; gap: 12px; box-sizing: border-box; height: 56px; padding: 0 12px; border-radius: 18px; background: rgba(255,255,255,0.14)">
<div style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #FFFFFF; color: {{accent}}; font-size: 11px; font-weight: 700; line-height: 36px; text-align: center">BIA</div>
<div style="flex: 1; font-size: 15px; font-weight: 600">Como posso ajudar?</div>
<button aria-label="Enviar" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #FFFFFF">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M21 3L3 10.5l7 3 3 7L21 3z"></path><path d="M10 13.5L21 3"></path></svg>
</button>
</div>

<svg style="position: absolute; left: 0; bottom: -1px; display: block" width="390" height="44" viewBox="0 0 390 44" preserveAspectRatio="none"><path d="M0 26C60 6 120 6 190 24S320 42 390 14V44H0Z" fill="#FFFFFF" fill-opacity="0.35"></path><path d="M0 34C70 16 130 18 200 32S330 46 390 26V44H0Z" fill="{{pageBg}}"></path></svg>
</div>

<!-- FAVORITOS -->
<section style="padding: 14px 20px 0">
<h2 style="margin: 0 0 14px; font-size: 18px; font-weight: 600; line-height: 24px">Favoritos</h2>
<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px">

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 92px; padding: 8px 2px; border: 0; border-radius: {{radius}}; background: #FFFFFF; box-shadow: 0 4px 14px rgba(40,30,50,0.08); color: {{accent}}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h14l-3-3"></path><path d="M20 15H6l3 3"></path></svg>
<span style="font-size: 11px; font-weight: 500; color: #3A3A44">Transferências</span>
</button>

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 92px; padding: 8px 2px; border: 0; border-radius: {{radius}}; background: #FFFFFF; box-shadow: 0 4px 14px rgba(40,30,50,0.08); color: {{accent}}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3.5l3 3-3 3-3-3z"></path><path d="M12 14.5l3 3-3 3-3-3z"></path><path d="M3.5 12l3-3 3 3-3 3z"></path><path d="M14.5 12l3-3 3 3-3 3z"></path></svg>
<span style="font-size: 11px; font-weight: 500; color: #3A3A44">Pix</span>
</button>

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 92px; padding: 8px 2px; border: 0; border-radius: {{radius}}; background: #FFFFFF; box-shadow: 0 4px 14px rgba(40,30,50,0.08); color: {{accent}}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"></path><path d="M8 9v6M10.5 9v6M13 9v6M15.5 9v6"></path></svg>
<span style="font-size: 11px; font-weight: 500; color: #3A3A44">Pagamentos</span>
</button>

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 92px; padding: 8px 2px; border: 0; border-radius: {{radius}}; background: #FFFFFF; box-shadow: 0 4px 14px rgba(40,30,50,0.08); color: {{accent}}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M3 10.5h18M6.5 14.5h4"></path></svg>
<span style="font-size: 11px; font-weight: 500; color: #3A3A44">Cartões</span>
</button>

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 92px; padding: 8px 2px; border: 0; border-radius: {{radius}}; background: #FFFFFF; box-shadow: 0 4px 14px rgba(40,30,50,0.08); color: {{accent}}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M14.5 9.5c-.5-1-1.5-1.3-2.5-1.3-1.4 0-2.4.7-2.4 1.8 0 2.6 5 1.2 5 3.9 0 1.1-1.1 1.9-2.6 1.9-1.1 0-2.1-.5-2.6-1.4M12 6.5v1.7M12 15.8v1.7"></path></svg>
<span style="font-size: 11px; font-weight: 500; color: #3A3A44">Empréstimos</span>
</button>

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 92px; padding: 8px 2px; border: 0; border-radius: {{radius}}; background: #FFFFFF; box-shadow: 0 4px 14px rgba(40,30,50,0.08); color: {{accent}}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17"></path><path d="M4.5 17l5-6 3.5 3L19 7"></path><path d="M15 7h4v4"></path></svg>
<span style="font-size: 11px; font-weight: 500; color: #3A3A44">Investimentos</span>
</button>

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 92px; padding: 8px 2px; border: 0; border-radius: {{radius}}; background: #FFFFFF; box-shadow: 0 4px 14px rgba(40,30,50,0.08); color: {{accent}}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="butt"><path d="M12 4a8 8 0 0 1 7.6 5.5"></path><path d="M19.9 14a8 8 0 0 1-5.4 5.6"></path><path d="M9.5 19.6A8 8 0 0 1 4 12"></path></svg>
<span style="font-size: 11px; font-weight: 500; color: #3A3A44">Open Finance</span>
</button>

<button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 92px; padding: 8px 2px; border: 0; border-radius: {{radius}}; background: #FFFFFF; box-shadow: 0 4px 14px rgba(40,30,50,0.08); color: #3F6FC4">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="9" cy="7" r="2" fill="#FFFFFF"></circle><circle cx="15" cy="12" r="2" fill="#FFFFFF"></circle><circle cx="8" cy="17" r="2" fill="#FFFFFF"></circle></svg>
<span style="font-size: 11px; font-weight: 500; color: #2F5DB0">Personalizar</span>
</button>

</div>
</section>

<!-- OFERTAS -->
<section style="padding: 20px 20px 0">
<h2 style="margin: 0 0 12px; font-size: 18px; font-weight: 600; line-height: 24px">Ofertas</h2>
<a href="#oferta" style="display: flex; align-items: center; gap: 14px; box-sizing: border-box; padding: 10px 14px 10px 10px; border-radius: {{radius}}; background: #FFFFFF; box-shadow: 0 4px 14px rgba(40,30,50,0.08); color: #2B2B33; text-decoration: none">
<div role="img" aria-label="Imagem da oferta" style="flex: none; width: 96px; height: 96px; border-radius: 14px; background: linear-gradient(135deg, #D9DCE3, #B9BEC9); display: flex; align-items: center; justify-content: center; color: #FFFFFF">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6"></path></svg>
</div>
<div style="flex: 1">
<div style="font-size: 15px; font-weight: 600; line-height: 22px">Precisando de mais dinheiro extra? Aqui você tem</div>
<div style="margin-top: 6px; font-size: 12px; font-weight: 500; line-height: 16px; color: #555560">Confira o limite disponível.</div>
</div>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<div style="margin-top: 12px; display: flex; justify-content: center; gap: 6px">
<span style="width: 28px; height: 5px; border-radius: 3px; background: {{accent}}"></span>
<span style="width: 5px; height: 5px; border-radius: 3px; background: #D2D2D9"></span>
</div>
</section>

<!-- NAVEGAÇÃO INFERIOR -->
<nav style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; height: 84px; padding: 8px 8px 12px; display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; box-shadow: 0 -4px 16px rgba(40,30,50,0.08)">

<button style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: #4A4A55">
<span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 40px; border-radius: 14px; background: {{accent}}; color: #FFFFFF">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"></path></svg>
</span>
<span style="font-size: 12px; font-weight: 600">Início</span>
</button>

<button style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: #5C5C68">
<span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 40px; color: #8A8A96">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-7l-4 4v-4H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"></path></svg>
</span>
<span style="font-size: 12px; font-weight: 600">Chat</span>
</button>

<button style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: #5C5C68">
<span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 40px; color: #8A8A96">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l1 12H4z"></path><path d="M9 10V7a3 3 0 0 1 6 0v3"></path></svg>
</span>
<span style="font-size: 12px; font-weight: 600">Shop</span>
</button>

<button style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: #5C5C68">
<span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 40px; color: #8A8A96">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 20c.4-4 3.4-6.2 7.5-6.2s7.1 2.2 7.5 6.2z"></path></svg>
</span>
<span style="font-size: 12px; font-weight: 600">Perfil</span>
</button>

<button style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: #5C5C68">
<span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 40px; color: #8A8A96">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"></rect></svg>
</span>
<span style="font-size: 12px; font-weight: 600">Serviços</span>
</button>

</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8143C"},"accentDark":{"editor":"color","default":"#D93A5C"},"pageBg":{"editor":"color","default":"#F4F4F7"},"saldo":{"editor":"text","default":"R$ 360,17"},"radius":{"editor":"text","default":"18px"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#C8143C',
accentDark: this.props.accentDark ?? '#D93A5C',
pageBg: this.props.pageBg ?? '#F4F4F7',
saldo: this.props.saldo ?? 'R$ 360,17',
radius: this.props.radius ?? '18px'
};
}
}
</script>
</body>
</html>
